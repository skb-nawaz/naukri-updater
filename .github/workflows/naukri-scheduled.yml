# GitHub Actions — Naukri Updater (cloud schedule, every 2 hours)
#
# Runs even when your PC and Jenkins are OFF. Free for public repos.
#
# ── One-time setup (5 min) ──────────────────────────────────────────
# 1. GitHub repo → Settings → Secrets and variables → Actions → New secret:
#      NAUKRI_ENCRYPTION_KEY       = ENCRYPTION_KEY from your local .env
#      NAUKRI_EMAIL_ENCRYPTED      = NAUKRI_EMAIL_ENCRYPTED from .env
#      NAUKRI_PASSWORD_ENCRYPTED   = NAUKRI_PASSWORD_ENCRYPTED from .env
# 2. Actions tab → "Naukri updater (every 2h)" → Run workflow (manual test).
# 3. If green, disable the Jenkins timer (open the Jenkins job →
#    Configure → uncheck nothing; instead: Jenkins job page → Disable
#    Project) so Jenkins and GitHub don't log in at the same time —
#    Naukri blocks parallel logins on one account.
# NOTE: GitHub runners use datacenter IPs. If runs fail with bot-wall
# "Access Denied", the cloud IP is flagged — fallback is a Raspberry Pi
# or Oracle free-tier VM (residential-like path) running the same suite.
# ────────────────────────────────────────────────────────────────────

name: Naukri updater (every 2h)

on:
  schedule:
    - cron: '0 */2 * * *' # every 2 hours, on the hour (UTC)
  workflow_dispatch: {} # manual "Run workflow" button for testing

concurrency:
  group: naukri-updater
  cancel-in-progress: false # never overlap two logins on one account

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - run: npm run typecheck

      - name: Run suite
        run: npx playwright test
        env:
          HEADLESS: 'true'
          CI: 'true'
          ENCRYPTION_KEY: ${{ secrets.NAUKRI_ENCRYPTION_KEY }}
          NAUKRI_EMAIL_ENCRYPTED: ${{ secrets.NAUKRI_EMAIL_ENCRYPTED }}
          NAUKRI_PASSWORD_ENCRYPTED: ${{ secrets.NAUKRI_PASSWORD_ENCRYPTED }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: naukri-results-${{ github.run_number }}
          path: |
            test-results/**
            playwright-report/**
          retention-days: 14
